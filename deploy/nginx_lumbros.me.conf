server {
    server_name lumbros.me www.lumbros.me;
    root /var/www/lumbros.me;
    index index.php index.html;

    client_max_body_size 64M;

    # ---- Security hardening ----
    location ~* ^/wp-json/batch(/|$)           { deny all; return 403; }
    location ~* ^/xmlrpc\.php$                 { deny all; return 403; }
    location ~* ^/wp-content/uploads/.*\.php$  { deny all; return 403; }
    location ~* ^/wp-content/cache/.*\.php$    { deny all; return 403; }
    location ~* ^/wp-content/upgrade/.*\.php$  { deny all; return 403; }
    location = /wp-json/wp/v2/users            { deny all; return 403; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        include snippets/wp-api-auth.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }

    location ~ /\.ht {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lumbros.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lumbros.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.lumbros.me) {
        return 301 https://$host$request_uri;
    }
    if ($host = lumbros.me) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name lumbros.me www.lumbros.me;
    return 404; # managed by Certbot
}
