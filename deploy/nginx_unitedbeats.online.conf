server {
    server_name unitedbeats.online www.unitedbeats.online;
    root /var/www/unitedbeats.online;
    index index.php index.html;
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, must-revalidate, max-age=0";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/unitedbeats.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/unitedbeats.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.unitedbeats.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = unitedbeats.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name unitedbeats.online www.unitedbeats.online;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
